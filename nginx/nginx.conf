# nginx Load Balancer Configuration for Socket.io Horizontal Scaling
# Requirements: 1.8
# 
# Features:
# - Sticky sessions via ip_hash for WebSocket persistence
# - WebSocket upgrade headers
# - Health check endpoint
# - Load balancing across 3 Socket.io instances

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ============================================================
    # Upstream: Socket.io Server Pool
    # ============================================================
    upstream socket_backend {
        # Sticky sessions using client IP hash
        # This ensures WebSocket connections stay on the same server
        ip_hash;

        # Socket.io instances
        server socket-server-1:3001 max_fails=3 fail_timeout=30s;
        server socket-server-2:3001 max_fails=3 fail_timeout=30s;
        server socket-server-3:3001 max_fails=3 fail_timeout=30s;

        # Keep connections alive for better performance
        keepalive 32;
    }

    # ============================================================
    # Server Configuration
    # ============================================================
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx healthy\n";
        }

        # Socket.io endpoint
        location /socket.io/ {
            # Proxy to Socket.io backend
            proxy_pass http://socket_backend;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve client IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Host headers
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts for long-lived WebSocket connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Buffering (disabled for WebSocket)
            proxy_buffering off;
            proxy_cache off;

            # Redirect HTTP/1.0 to prevent issues
            proxy_redirect off;
        }

        # Metrics endpoint (Prometheus format)
        location /metrics {
            proxy_pass http://socket_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Default location (optional - for debugging)
        location / {
            add_header Content-Type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head><title>NexTalk Load Balancer</title></head>
<body>
<h1>NexTalk Load Balancer</h1>
<p>Socket.io endpoint: <code>ws://localhost:8080/socket.io/</code></p>
<p>Health check: <a href="/health">/health</a></p>
<p>Metrics: <a href="/metrics">/metrics</a></p>
<hr>
<p><strong>Active Backend Servers:</strong></p>
<ul>
<li>socket-server-1:3001</li>
<li>socket-server-2:3001</li>
<li>socket-server-3:3001</li>
</ul>
<p><strong>Load Balancing Strategy:</strong> IP Hash (Sticky Sessions)</p>
</body>
</html>';
        }
    }
}

# ============================================================
# Configuration Notes
# ============================================================
# 
# IP Hash (Sticky Sessions):
#   - Routes clients to the same backend based on IP address
#   - Essential for WebSocket connections that can't be migrated mid-session
#   - Ensures reconnections go to the same server
#   - Trade-off: Less perfect load distribution, but required for WebSocket
#
# Alternative Sticky Session Methods (not used here):
#   - Cookie-based: `sticky cookie srv_id expires=1h;` (requires nginx-plus)
#   - Least connections: `least_conn;` (better distribution, no stickiness)
#   - Round robin: default (no stickiness)
#
# WebSocket Upgrade:
#   - `Upgrade: websocket` and `Connection: upgrade` headers required
#   - HTTP/1.1 required for WebSocket
#   - Buffering disabled for real-time communication
#
# Timeouts:
#   - 7 days for long-lived WebSocket connections
#   - Prevents nginx from closing idle connections
#   - Adjust based on application needs
#
# Health Checks:
#   - nginx health: GET /health (this config)
#   - Backend health: nginx checks via max_fails and fail_timeout
#   - Docker healthcheck: verifies container status
#
# ============================================================
# Testing Configuration
# ============================================================
# 
# Test nginx config syntax:
#   docker-compose exec nginx nginx -t
#
# Reload nginx without downtime:
#   docker-compose exec nginx nginx -s reload
#
# View nginx logs:
#   docker-compose logs -f nginx
#
# Test load balancing:
#   curl http://localhost:8080/health
#
# Test WebSocket connection:
#   Use browser console:
#   const socket = io('http://localhost:8080');
#   socket.on('connect', () => console.log('Connected!'));
#
# Verify sticky sessions:
#   1. Connect multiple clients from same IP
#   2. Check logs to see they connect to same backend:
#      docker-compose logs | grep "Client connected"
#
# ============================================================
