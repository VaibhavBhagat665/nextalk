# coturn TURN Server Configuration
# For WebRTC NAT traversal when direct UDP/TCP connections fail
#
# This TURN server helps clients behind strict NATs/firewalls
# establish media connections by relaying traffic through the server.

# ============================================================
# Listening Configuration
# ============================================================

# Listen on standard TURN ports
listening-port=3478
tls-listening-port=5349

# Listen on all interfaces
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# External IP address (set via environment variable in production)
# This should be your server's public IP
# external-ip will be set via command line argument

# ============================================================
# Realm and Server Configuration
# ============================================================

# TURN realm (used for authentication)
realm=nextalk.turn

# Server name
server-name=nextalk-turn-server

# ============================================================
# Authentication
# ============================================================

# Use long-term credential mechanism (username/password)
lt-cred-mech

# Static user credentials (for testing)
# In production, use dynamic credentials via REST API
# Format: username=password
user=nextalk:nextturn2024

# For production: use time-limited credentials via REST API
# This prevents credential sharing and enhances security
# Uncomment and configure a REST API endpoint:
# use-auth-secret
# static-auth-secret=YOUR_SHARED_SECRET_HERE

# ============================================================
# Security and Rate Limiting
# ============================================================

# Fingerprinting - required for WebRTC
fingerprint

# Disable RFC5780 (NAT behavior discovery) for security
no-rfc5780

# Disable STUN binding requests from peers
no-stun

# Disable loopback peers for security
no-loopback-peers

# Disable multicast peers for security
no-multicast-peers

# Deny private/local IP ranges from being relayed
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# IPv6 private ranges
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ============================================================
# Port Ranges
# ============================================================

# Port range for relay connections
# These ports must be opened in firewall
min-port=49152
max-port=65535

# ============================================================
# Performance and Limits
# ============================================================

# Maximum number of relay connections per client
max-bps=0

# User quota (in bytes)
user-quota=0
total-quota=0

# ============================================================
# Logging
# ============================================================

# Log file location
log-file=/var/log/turnserver.log

# Verbose logging (disable in production for performance)
verbose

# Log connections
log-binding

# ============================================================
# TLS/DTLS Configuration (Optional)
# ============================================================

# Uncomment for TLS support
# Requires valid SSL certificates
# cert=/path/to/turn_server_cert.pem
# pkey=/path/to/turn_server_pkey.pem

# DTLS support for WebRTC
# no-dtls

# ============================================================
# Database (Optional)
# ============================================================

# For persistent user management, use Redis or PostgreSQL
# Example with Redis:
# redis-userdb="ip=redis port=6379 dbname=2 password=turn connect_timeout=30"

# ============================================================
# Mobility and ICE
# ============================================================

# Mobility with ICE (RFC 8016)
mobility

# Prometheus metrics endpoint (optional)
# prometheus

# ============================================================
# Process Management
# ============================================================

# Run as daemon (handled by Docker)
# no-daemonize

# PID file
pidfile=/var/run/turnserver.pid

# ============================================================
# Notes for Production Deployment
# ============================================================
#
# 1. Replace static credentials with time-limited credentials
#    - Use REST API with shared secret
#    - Generate temporary credentials for each session
#    - Example: username=timestamp:userid, password=hmac(secret, username)
#
# 2. Set external-ip to your server's public IP or domain
#    - Can be set via environment variable or command line
#    - Example: --external-ip=1.2.3.4
#
# 3. Configure TLS certificates for secure connections
#    - Use Let's Encrypt for free SSL certificates
#    - Mount certificates into Docker container
#
# 4. Open required ports in firewall:
#    - 3478 (UDP/TCP) - STUN/TURN
#    - 5349 (UDP/TCP) - TURNS (TLS)
#    - 49152-65535 (UDP) - Relay ports
#
# 5. Monitor resource usage:
#    - Each relay connection uses ~100KB/s of bandwidth
#    - Estimate: 100 concurrent calls = ~10MB/s = ~10Mbps
#
# 6. Consider geographic distribution:
#    - Deploy TURN servers in multiple regions
#    - Route clients to nearest server for lowest latency
#
# ============================================================
