# Docker Compose for Horizontal Scaling Test
# Runs 3 Socket.io instances behind nginx with Redis pub/sub
# Requirements: 1.8

version: '3.8'

services:
  # ============================================================
  # Redis for pub/sub across Socket.io instances
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: nextalk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nextalk-network
    restart: unless-stopped

  # ============================================================
  # Socket.io Server Instance 1
  # ============================================================
  socket-server-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nextalk-socket-1
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - UPSTASH_REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - INSTANCE_ID=socket-1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nextalk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============================================================
  # Socket.io Server Instance 2
  # ============================================================
  socket-server-2:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nextalk-socket-2
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - UPSTASH_REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - INSTANCE_ID=socket-2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nextalk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============================================================
  # Socket.io Server Instance 3
  # ============================================================
  socket-server-3:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nextalk-socket-3
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - UPSTASH_REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - INSTANCE_ID=socket-3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nextalk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============================================================
  # nginx Load Balancer with Sticky Sessions
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: nextalk-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - socket-server-1
      - socket-server-2
      - socket-server-3
    networks:
      - nextalk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # coturn TURN Server (NAT Traversal for WebRTC)
  # ============================================================
  # TURN server helps clients behind strict NATs/firewalls
  # establish WebRTC connections by relaying media traffic.
  # Only needed when direct peer connections fail.
  # ============================================================
  turnserver:
    image: coturn/coturn:latest
    container_name: nextalk-turnserver
    ports:
      # STUN/TURN ports
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # TURNS (TLS) ports
      - "5349:5349/udp"
      - "5349:5349/tcp"
      # Relay port range (can be limited for security)
      - "49152-49252:49152-49252/udp"
    volumes:
      - ./docker/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - turnserver-logs:/var/log
    environment:
      # Set external IP (use your public IP in production)
      - EXTERNAL_IP=${TURN_EXTERNAL_IP:-127.0.0.1}
    # Override config with environment-based external IP
    command: >
      -c /etc/coturn/turnserver.conf
      --external-ip=$$EXTERNAL_IP
      --verbose
    networks:
      - nextalk-network
    restart: unless-stopped
    healthcheck:
      # Simple UDP check on TURN port
      test: ["CMD-SHELL", "nc -zu localhost 3478 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ============================================================
# Networks
# ============================================================
networks:
  nextalk-network:
    driver: bridge

# ============================================================
# Volumes
# ============================================================
volumes:
  redis-data:
    driver: local
  turnserver-logs:
    driver: local

# ============================================================
# Usage Instructions
# ============================================================
# 
# Start all services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f
#
# View specific service logs:
#   docker-compose logs -f socket-server-1
#
# Scale Socket.io instances:
#   docker-compose up -d --scale socket-server-1=2
#
# Stop all services:
#   docker-compose down
#
# Stop and remove volumes:
#   docker-compose down -v
#
# Rebuild after code changes:
#   docker-compose up -d --build
#
# Check service health:
#   docker-compose ps
#
# ============================================================
# Testing Cross-Instance Messaging
# ============================================================
#
# 1. Connect Client A to http://localhost:8080 (nginx)
# 2. Connect Client B to http://localhost:8080 (nginx)
# 3. Clients may be routed to different Socket.io instances
# 4. Messages should be delivered via Redis pub/sub
# 5. Check logs to verify which instance each client connected to:
#      docker-compose logs | grep "Client connected"
#
# ============================================================
# Testing TURN Server
# ============================================================
#
# 1. Start services including TURN server:
#      docker-compose up -d
#
# 2. Check TURN server logs:
#      docker-compose logs -f turnserver
#
# 3. Run connectivity test:
#      npx tsx scripts/test-turn-server.ts
#
# 4. Test in browser (Trickle ICE tool):
#      https://webrtc.github.io/samples/src/content/peerconnection/trickle-ice/
#      - Add: turn:localhost:3478
#      - Username: nextalk
#      - Password: nextturn2024
#      - Look for "relay" candidates
#
# 5. Test with real WebRTC connection:
#      - Join a voice/video channel
#      - Check browser console for "relay" ICE candidates
#      - Verify media connection works even with strict NAT
#
# ============================================================
