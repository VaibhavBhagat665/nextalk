services:
  # Socket.io Server using Docker
  - type: web
    name: nextalk-socket-server
    runtime: docker
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false # Set this in Render dashboard
      - key: REDIS_URL
        sync: false # Set this in Render dashboard
      - key: GROQ_API_KEY
        sync: false # Set this in Render dashboard (optional)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set this in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set this in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set this in Render dashboard
    healthCheckPath: /health
    autoDeploy: true
